
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="college-header">
       <img
            src="college.jpg"
            alt="KPR Institute of Engineering and Technology"
            class="college-banner"
        >

        <div class="college-overlay">
            <h1>KPR Institute of Engineering and Technology</h1>
            
        </div>

    </header>

    <div class="container">
        <h1>Student Registration</h1>
        <p class="subtitle">Enter your details to register</p>

        <form id="registrationForm" novalidate>

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name">
                <small class="error" id="nameError"></small>
            </div>

            <div class="form-group">
                <label for="roll">Roll Number</label>
                <input type="text" id="roll" placeholder="Enter your roll number">
                <small class="error" id="rollError"></small>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="example@email.com">
                <small class="error" id="emailError"></small>
            </div>

            <div class="form-group">
                <label for="course">Select Course</label>
                <select id="course">
                    <option value="">-- Select Course --</option>
                    <option value="BCA">BCA</option>
                    <option value="BSc CS">B.Sc. Computer Science</option>
                    <option value="BTech">B.Tech</option>
                    <option value="MCA">MCA</option>
                    <option value="BBA">BBA</option>
                </select>
                <small class="error" id="courseError"></small>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password"
                       placeholder="Create a strong password">
                <small class="hint">
                    At least 8 characters, including uppercase, lowercase,
                    number and special character.
                </small>
                <small class="error" id="passwordError"></small>
            </div>

            <div class="form-group">
                <label for="document">Upload Student Document</label>
                <input type="file" id="document" accept=".pdf,.jpg,.jpeg,.png">
                <small class="hint">Allowed formats: PDF, JPG, PNG (max 2 MB)</small>
                <small class="error" id="documentError"></small>
            </div>

            <button type="submit">Register Now</button>

            <p id="successMessage" role="status"></p>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
